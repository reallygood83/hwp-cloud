<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HWP Cloud</title>
    <meta name="description" content="브라우저에서 한글(HWP·HWPX) 문서를 열고 편집하고, 템플릿을 클라우드에 보관합니다." />
    <meta
      name="ai-agent-instructions"
      content="왼쪽 편집기는 그림이라 글자를 읽을 수 없습니다. 오른쪽 Aside 도구의 문단 번호와 표를 읽고, 아래 입력칸으로 고치세요. 자바스크립트가 되면 window.hwpCloud.help(). 안내: /llms.txt"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='17' fill='white'%3E한%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">한</span>
        <span class="title">HWP Cloud</span>
        <span class="sep" aria-hidden="true">/</span>
        <span id="docName" class="doc-name">문서 없음</span>
        <span id="docFormat" class="badge" hidden></span>
      </div>
      <div class="actions">
        <button id="newBtn" class="btn ghost" type="button">새 문서</button>
        <button id="openBtn" class="btn ghost" type="button">열기</button>
        <input id="openInput" type="file" accept=".hwp,.hwpx" hidden />
        <button id="templatesBtn" class="btn ghost" type="button">템플릿</button>
        <button id="downloadBtn" class="btn primary" type="button" disabled title="현재 문서를 HWP 파일로 내려받습니다">HWP로 내려받기</button>
        <button id="toolsBtn" class="btn ghost tools-toggle" type="button" aria-pressed="true" aria-controls="toolsPanel">Aside 도구</button>
        <div id="account" class="account"></div>
      </div>
    </header>

    <main class="workspace">
      <aside id="toolsPanel" class="tools" aria-label="Aside 도구">
        <div class="tools-head">
          <strong>Aside 도구</strong>
          <button id="toolsClose" class="btn ghost icon" type="button" aria-label="Aside 도구 닫기">✕</button>
        </div>
        <p class="tools-note">문서 글자는 여기 있습니다. 왼쪽 편집기 버튼은 무시하세요. 바꾼 내용은 Ctrl+Z로 되돌립니다.</p>
        <p id="workResult" class="work-result" role="status" aria-live="polite"></p>

        <section class="tool" aria-labelledby="outlineHead">
          <div class="tool-head">
            <h2 id="outlineHead">문서</h2>
            <button id="refreshOutlineBtn" class="btn small" type="button">문서 새로고침</button>
          </div>
          <div id="outline" class="outline"><p class="hint">문서를 열면 문단 번호와 표가 여기에 표시됩니다.</p></div>
          <p id="outlineStats" class="hint"></p>
        </section>

        <section class="tool" aria-labelledby="paraHead">
          <h2 id="paraHead">문단 고치기</h2>
          <form id="paraForm" class="stack">
            <label>문단 번호 <input id="paraNo" type="number" min="1" required /></label>
            <label>새 내용 <textarea id="paraText" rows="3"></textarea></label>
            <div class="btn-row">
              <button class="btn primary" type="submit" value="replace">문단 바꾸기</button>
              <button class="btn" type="submit" value="insert">이 문단 뒤에 넣기</button>
              <button class="btn danger" type="submit" value="delete">이 문단 삭제</button>
            </div>
          </form>
        </section>

        <section class="tool" aria-labelledby="cellHead">
          <h2 id="cellHead">표 칸 고치기</h2>
          <form id="cellForm" class="stack">
            <div class="btn-row">
              <label>표 번호 <input id="cellTable" type="number" min="1" required /></label>
              <label>행 <input id="cellRow" type="number" min="1" required /></label>
              <label>열 <input id="cellCol" type="number" min="1" required /></label>
            </div>
            <label>칸 내용 <textarea id="cellText" rows="2"></textarea></label>
            <button class="btn primary" type="submit">칸 바꾸기</button>
          </form>
        </section>

        <section class="tool" aria-labelledby="replaceHead">
          <h2 id="replaceHead">찾아 바꾸기</h2>
          <form id="replaceForm" class="stack">
            <label>찾을 내용 <input id="findInput" type="text" required /></label>
            <label>바꿀 내용 <input id="replaceInput" type="text" /></label>
            <button class="btn primary" type="submit">모두 바꾸기</button>
          </form>
        </section>

        <section class="tool" aria-labelledby="selectionHead">
          <h2 id="selectionHead">선택 영역</h2>
          <p id="selectionNow" class="sel-now">선택된 글자가 없습니다.</p>
          <form id="selectionForm" class="stack">
            <label>새 내용 <textarea id="selectionNew" rows="2"></textarea></label>
            <button class="btn primary" type="submit">선택 영역을 바꾸기</button>
          </form>
        </section>
      </aside>

      <section class="editor-area" aria-label="문서 편집기">
        <iframe id="editorFrame" class="editor-frame" src="/editor/index.html?v=2" title="한글 문서 편집기. 글자는 Aside 도구에서 읽습니다." aria-hidden="true"></iframe>
      </section>
    </main>

    <div id="templatesModal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="templatesTitle">
        <div class="modal-head">
          <strong id="templatesTitle">템플릿 라이브러리</strong>
          <button id="templatesClose" class="btn ghost icon" type="button" aria-label="닫기">✕</button>
        </div>
        <p id="storeNote" class="store-note"></p>
        <div id="templatesGate" class="gate" hidden>
          <p>템플릿은 구글 계정에 저장되어 어느 컴퓨터에서든 불러올 수 있습니다.</p>
          <button id="gateSignIn" class="btn primary" type="button">구글로 로그인</button>
        </div>
        <div id="templatesBody">
          <form id="saveTemplateForm" class="save-form">
            <input id="templateName" type="text" placeholder="템플릿 이름 (예: 가정통신문)" maxlength="100" required aria-label="템플릿 이름" />
            <input id="templateDesc" type="text" placeholder="설명 (선택)" maxlength="200" aria-label="템플릿 설명" />
            <button id="saveCurrentBtn" class="btn primary" type="submit">현재 문서 저장</button>
            <button id="saveFileBtn" class="btn" type="button">파일에서 추가</button>
            <input id="templateFileInput" type="file" accept=".hwp,.hwpx" hidden />
          </form>
          <ul id="templatesList" class="template-list" aria-label="저장된 템플릿"></ul>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
